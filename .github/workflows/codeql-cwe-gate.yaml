name: CodeQL Security Gate (CWE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  codeql-security-gate:
    runs-on: ubuntu-latest

    # Явное указание разрешений
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # Клонирование кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установка .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      # Инициализация CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality
          
      # Сборка проекта
      - name: Restore dependencies
        run: dotnet restore ./WebApplicationCinema.sln

      - name: Build project
        run: dotnet build ./WebApplicationCinema.sln -c Release --no-restore

      # Запуск анализа
      - name: Perform CodeQL Analysis
        run: |
          codeql database create ./codeql-db --language=csharp \
            --command="dotnet build ./WebApplicationCinema.sln -c Release --no-restore"
          codeql database analyze ./codeql-db codeql/csharp-security-and-quality.qls \
            --format=sarif-latest --output=./codeql-results.sarif

      # Загрузка SARIF 
      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./codeql-results.sarif
          category: codeql
      
      # Падение сборки при наличии CWE
      - name: Security Gate (CWE check)
        if: always()
        run: |
          set -e
          
          SARIF_FILE=./codeql-results.sarif
          
          if [ -z "$SARIF_FILE" ]; then
            echo "::warning::SARIF file not found — skipping CodeQL gate"
            exit 0
          fi
          echo "Используем SARIF: $SARIF_FILE"

          COUNT=$(jq '
            ([.runs[0].tool.driver.rules[]
              | {key: .id, value: {
                  tags: (.properties.tags // []),
                  sev:  ((.properties."security-severity" // "0") | tonumber)
                }}] | from_entries) as $rules
            | [.runs[0].results[]
               | select(
                   ($rules[.ruleId].tags | map(test("external/cwe")) | any)
                 )
              ] | length
          ' "$SARIF_FILE")

          echo "Найдено критических CWE: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Security Gate FAILED: CodeQL обнаружил $COUNT CWE"
            exit 1
          fi
          echo "Security Gate PASSED: CWE не обнаружено."
